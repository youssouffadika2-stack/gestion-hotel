# Déploiement Coolify : 3 services (base MySQL, administration générale, gestion-hotel)
# Variables à définir dans Coolify : DB_PASSWORD, APP_KEY, BRIDGE_SECRET, ADMIN_URL, GESTION_URL (URLs complètes https://...)
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: hotels
      MYSQL_USER: hotel
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./admin_hotel/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10

  admin:
    build: ./admin_hotel
    restart: unless-stopped
    depends_on: [db]
    environment:
      DB_HOST: db
      DB_NAME: hotels
      DB_USER: hotel
      DB_PASS: ${DB_PASSWORD}
      GESTION_DB: laravel_hotel
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      GESTION_BASE_URL: ${GESTION_URL}
    volumes:
      - uploads:/var/www/html/uploads

  gestion:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      APP_NAME: HotelPro
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${GESTION_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: laravel_hotel
      VITRINE_DB_DATABASE: hotels
      DB_USERNAME: hotel
      DB_PASSWORD: ${DB_PASSWORD}
      HOTEL_ADMIN_URL: ${ADMIN_URL}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      TRUSTED_PROXIES: "*"

volumes:
  dbdata:
  uploads:
